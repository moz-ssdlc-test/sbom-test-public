name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/**' # branch must match this pattern e.g release/v1.0.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sbom:
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@ca8be48f3c06204fb16a3bd5ffa6d916782bbc76
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}

      