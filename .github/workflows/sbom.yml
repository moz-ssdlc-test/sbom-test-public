name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/**' # branch must match this pattern e.g release/v1.0.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sbom:
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@d355de9a0cb79e0be2599696064231ee49aebb92
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}

      