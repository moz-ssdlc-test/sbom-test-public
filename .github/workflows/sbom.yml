name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/**' # branch must match this pattern e.g release/v1.0.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sbom:
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@812e46e95a00cd1076c0d3c2bd03d109f8ff4d68
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}

      