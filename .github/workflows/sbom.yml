name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/**' # branch must match this pattern e.g release/v1.0.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sbom:
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@c545f6aed7a9d5cae69d775845e8a3099f4ee290
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}

      