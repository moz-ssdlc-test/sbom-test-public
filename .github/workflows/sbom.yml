name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    branches:
      - 'release/**' # branch must match this pattern e.g release/v1.0.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  sbom:
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@aa759c845c83060e2473fd8df60f9f408e34675d
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}

      